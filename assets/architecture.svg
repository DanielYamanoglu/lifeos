<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="959" height="419" fill="none" stroke="#cbd5e1"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#0f172a">LifeOS architecture</text>

  <!-- capture -->
  <rect x="24" y="70" width="170" height="200" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="109" y="94" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">1. Capture</text>
  <text x="109" y="122" font-size="12" fill="#0f172a" text-anchor="middle">text notes</text>
  <text x="109" y="142" font-size="12" fill="#0f172a" text-anchor="middle">markdown files</text>
  <text x="109" y="162" font-size="12" fill="#0f172a" text-anchor="middle">chat adapter</text>
  <text x="109" y="182" font-size="11" fill="#475569" text-anchor="middle">(interface + fake)</text>
  <text x="109" y="214" font-size="12" fill="#0f172a" text-anchor="middle">chunking</text>
  <text x="109" y="234" font-size="12" fill="#0f172a" text-anchor="middle">content-hash dedup</text>

  <!-- extraction -->
  <rect x="236" y="70" width="170" height="200" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="321" y="94" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">2. Extraction</text>
  <text x="321" y="122" font-size="12" fill="#0f172a" text-anchor="middle">rule-based or LLM</text>
  <text x="321" y="142" font-size="12" fill="#0f172a" text-anchor="middle">entities + relations</text>
  <text x="321" y="170" font-size="11" fill="#475569" text-anchor="middle">Person · Project · Topic</text>
  <text x="321" y="186" font-size="11" fill="#475569" text-anchor="middle">Task · Event · Note</text>
  <text x="321" y="214" font-size="12" fill="#0f172a" text-anchor="middle">embeddings</text>
  <text x="321" y="234" font-size="11" fill="#475569" text-anchor="middle">MiniLM / hashing fallback</text>

  <!-- stores -->
  <rect x="448" y="70" width="170" height="90" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="533" y="94" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">3a. Neo4j graph</text>
  <text x="533" y="116" font-size="12" fill="#0f172a" text-anchor="middle">entities, MENTIONS,</text>
  <text x="533" y="134" font-size="12" fill="#0f172a" text-anchor="middle">typed relations</text>
  <text x="533" y="150" font-size="10" fill="#475569" text-anchor="middle">(in-memory by default)</text>
  <rect x="448" y="180" width="170" height="90" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="533" y="204" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle">3b. Qdrant vectors</text>
  <text x="533" y="226" font-size="12" fill="#0f172a" text-anchor="middle">chunk embeddings</text>
  <text x="533" y="244" font-size="12" fill="#0f172a" text-anchor="middle">+ payload</text>
  <text x="533" y="260" font-size="10" fill="#475569" text-anchor="middle">(in-memory by default)</text>

  <!-- retrieval -->
  <rect x="660" y="70" width="140" height="200" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="730" y="94" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">4. Hybrid retrieval</text>
  <text x="730" y="122" font-size="12" fill="#0f172a" text-anchor="middle">vector top-k</text>
  <text x="730" y="142" font-size="12" fill="#0f172a" text-anchor="middle">+ k-hop graph</text>
  <text x="730" y="162" font-size="12" fill="#0f172a" text-anchor="middle">expansion</text>
  <text x="730" y="190" font-size="12" fill="#0f172a" text-anchor="middle">reciprocal rank</text>
  <text x="730" y="208" font-size="12" fill="#0f172a" text-anchor="middle">fusion</text>
  <text x="730" y="236" font-size="11" fill="#475569" text-anchor="middle">results + "why"</text>
  <text x="730" y="252" font-size="11" fill="#475569" text-anchor="middle">provenance</text>

  <!-- interfaces -->
  <rect x="842" y="70" width="98" height="200" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="891" y="94" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">5. Surfaces</text>
  <text x="891" y="128" font-size="12" fill="#0f172a" text-anchor="middle">3 agents</text>
  <text x="891" y="146" font-size="10" fill="#475569" text-anchor="middle">capture · answer</text>
  <text x="891" y="160" font-size="10" fill="#475569" text-anchor="middle">· planner</text>
  <text x="891" y="190" font-size="12" fill="#0f172a" text-anchor="middle">MCP server</text>
  <text x="891" y="228" font-size="12" fill="#0f172a" text-anchor="middle">FastAPI</text>

  <!-- arrows -->
  <line x1="194" y1="170" x2="234" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="406" y1="150" x2="446" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="406" y1="190" x2="446" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="618" y1="120" x2="658" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="618" y1="225" x2="658" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="170" x2="840" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- footer: write path / read path -->
  <rect x="24" y="300" width="916" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="326" font-size="12" font-weight="700" fill="#0f172a">Write path (idempotent)</text>
  <text x="40" y="346" font-size="12" fill="#334155">note id = hash(content). Vectors are written first, the Note node last, so a crashed ingest is repaired by re-running it.</text>
  <text x="40" y="372" font-size="12" font-weight="700" fill="#0f172a">Read path</text>
  <text x="40" y="390" font-size="12" fill="#334155">query → vector hits + entities named in the query → expand k hops in the graph → notes mentioning reached entities → RRF.</text>
</svg>
